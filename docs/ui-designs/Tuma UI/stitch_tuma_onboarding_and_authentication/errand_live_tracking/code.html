</div>
<!-- Live Movement Simulation UI Elements -->

<!-- Delivery Route Visualization (Simulated) -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full max-w-md">
<!-- Start Point -->
<div class="absolute top-20 left-10 flex flex-col items-center">

<div class="relative flex items-center justify-center">
<div class="absolute w-12 h-12 bg-primary-container/30 rounded-full animate-ping"></div>
<div class="relative w-10 h-10 bg-primary flex items-center justify-center rounded-full shadow-lg border-2 border-surface">

</div>
</div>
</div>
<!-- Destination Point -->
<div class="absolute bottom-40 right-10 flex flex-col items-center">
<div class="w-6 h-6 bg-primary-container flex items-center justify-center rounded-full border-2 border-white shadow-md">
<span class="material-symbols-outlined text-[14px]" data-icon="home"></span>
</div>
<div class="mt-2 bg-surface px-xs py-base border border-outline-variant text-label-sm font-label-sm shadow-sm rounded-lg">Home (You)</div>
</div>
</div>
<!-- ETA Floating Badge -->
<div class="absolute top-lg left-container-margin bg-surface px-md py-sm border border-outline-variant shadow-sm flex items-center gap-xs rounded-2xl">

<div>

</div>

</div>
<div>

<!-- Bottom Navigation Shell (Relevance check: Sub-page hide navigation but here we use it as the errand is a top-level feature) -->
<!-- Note: Following the "Destination Rule", for focused tracking, the BottomNavBar is usually suppressed to prioritize the map and runner card -->
<script>
        // Micro-interactions for the "live" feeling
        document.addEventListener('DOMContentLoaded', () => {
            const runner = document.querySelector('.runner-pulse');
            let angle = 0;

            // Subtle "breathing" animation for runner movement
            function animateRunner() {
                if(runner) {
                    const x = Math.sin(angle) * 5;
                    const y = Math.cos(angle) * 5;
                    runner.style.transform = `translate(${x}px, ${y}px)`;
                    angle += 0.02;
                }
                requestAnimationFrame(animateRunner);
            }
            animateRunner();
        });
    </script>
