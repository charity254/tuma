</div>

<div class="flex flex-col gap-base">

<script>
        // Micro-interaction for form validation/state
        const form = document.getElementById('errandDetailsForm');
        const continueBtn = form.querySelector('button[type="submit"]');

        form.addEventListener('input', () => {
            const isDescriptionFilled = document.getElementById('description').value.trim().length > 0;
            const isTypeSelected = document.getElementById('parcelType').value !== "";
            
            if (isDescriptionFilled && isTypeSelected) {
                continueBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                continueBtn.classList.add('bg-primary-container');
            } else {
                // continueBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            // Simulate navigation to step 4
            console.log("Navigating to Step 4...");
            // window.location.href = 'step4.html';
        });

        // Floating label effect or highlight on focus
        const inputs = document.querySelectorAll('.form-input, .form-textarea, .form-select');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.previousElementSibling.classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.previousElementSibling.classList.remove('text-primary');
            });
        });
    </script>
