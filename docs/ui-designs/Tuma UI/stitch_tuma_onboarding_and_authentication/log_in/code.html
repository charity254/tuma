<p class="font-body-md text-body-md text-on-surface-variant">Log in to manage your errands seamlessly.</p>
</div>
<!-- Form -->
<form class="space-y-lg">
<!-- Email Input -->
<div class="flex flex-col">
<label class="font-label-sm text-label-sm text-on-surface-variant mb-base" for="email">Email</label>
<input class="bg-transparent border-0 border-b border-surface-variant focus:border-b-2 focus:border-primary-container focus:ring-0 px-0 py-sm font-body-md text-body-md text-on-surface transition-colors rounded-2xl" id="email" placeholder="your@email.com" required="" type="email">
</div>
<!-- Password Input -->
<div class="flex flex-col">
<div class="flex justify-between items-end mb-base">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary-container hover:text-primary transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="w-full bg-transparent border-0 border-b border-surface-variant focus:border-b-2 focus:border-primary-container focus:ring-0 px-0 py-sm font-body-md text-body-md text-on-surface pr-10 transition-colors rounded-2xl" id="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-0 top-1/2 -translate-y-1/2 text-primary-container hover:text-primary p-2 flex items-center justify-center transition-colors" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">visibility</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="pt-sm space-y-md">
<button class="w-full bg-primary-container text-on-primary-container font-label-md text-label-md py-md rounded-2xl hover:opacity-90 transition-opacity flex items-center justify-center" type="submit">Log in</button>
<div class="relative flex items-center py-md">
<div class="flex-grow border-t border-surface-variant"></div>
<span class="flex-shrink-0 mx-md font-label-sm text-label-sm text-on-surface-variant uppercase">Or</span>
<div class="flex-grow border-t border-surface-variant"></div>
</div>
<button class="w-full bg-surface-container-lowest border border-surface-variant text-on-surface font-label-md text-label-md py-md rounded-2xl hover:bg-surface-container-low transition-colors flex items-center justify-center gap-sm" type="button"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25C22.56 11.47 22.49 10.72 22.36 10H12V14.26H17.92C17.67 15.63 16.89 16.81 15.72 17.58V20.34H19.28C21.36 18.42 22.56 15.6 22.56 12.25Z" fill="#4285F4"></path><path d="M12 23C14.97 23 17.46 22.02 19.28 20.34L15.72 17.58C14.73 18.24 13.48 18.65 12 18.65C9.13 18.65 6.71 16.71 5.84 14.13H2.18V16.97C3.99 20.53 7.7 23 12 23Z" fill="#34A853"></path><path d="M5.84 14.13C5.62 13.47 5.49 12.75 5.49 12C5.49 11.25 5.62 10.53 5.84 9.87V7.03H2.18C1.43 8.52 1 10.2 1 12C1 13.8 1.43 15.48 2.18 16.97L5.84 14.13Z" fill="#FBBC05"></path><path d="M12 5.35C13.62 5.35 15.07 5.91 16.21 7L19.35 3.86C17.45 2.1 14.97 1 12 1C7.7 1 3.99 3.47 2.18 7.03L5.84 9.87C6.71 7.29 9.13 5.35 12 5.35Z" fill="#EA4335"></path></svg>Continue with Google</button>
