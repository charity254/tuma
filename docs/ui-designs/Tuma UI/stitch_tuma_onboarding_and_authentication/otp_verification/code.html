<script>
        // Simple OTP input focus logic
        const inputs = document.querySelectorAll('.otp-input');
        
        // Focus first input on load
        if(inputs.length > 0) {
            setTimeout(() => inputs[0].focus(), 100);
        }

        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                // Ensure only numbers
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
                
                // Move to next input if a digit was entered
                if (e.target.value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                // Move to previous input on backspace if current is empty
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Simple countdown logic
        let timeLeft = 45;
        const countdownEl = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft < 0) {
                clearInterval(timer);
                countdownEl.innerHTML = '<a href="#" class="underline text-primary">Resend Now</a>';
                countdownEl.previousElementSibling.style.display = 'none'; // hide the clock icon
                countdownEl.parentElement.innerHTML = countdownEl.innerHTML; // replace entire p content
            } else {
                const seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
                countdownEl.innerText = `0:${seconds}`;
            }
        }, 1000);
    </script>
