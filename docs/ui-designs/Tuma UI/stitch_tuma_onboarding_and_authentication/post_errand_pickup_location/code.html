<script>
        // Micro-interactions and state handling
        const input = document.querySelector('input');
        const continueBtn = document.getElementById('continue-btn');

        input.addEventListener('input', (e) => {
            if (e.target.value.length > 5) {
                // Activate button state
                continueBtn.disabled = false;
                continueBtn.classList.remove('bg-secondary-container', 'text-on-secondary-container', 'cursor-not-allowed', 'opacity-70');
                continueBtn.classList.add('bg-primary-container', 'text-on-primary-container', 'hover:bg-primary-fixed-dim', 'active:scale-95');
            } else {
                // Return to disabled
                continueBtn.disabled = true;
                continueBtn.classList.add('bg-secondary-container', 'text-on-secondary-container', 'cursor-not-allowed', 'opacity-70');
                continueBtn.classList.remove('bg-primary-container', 'text-on-primary-container', 'hover:bg-primary-fixed-dim', 'active:scale-95');
            }
        });

        // Add a simple "bounce" effect to the pin when the map would "move"
        let timer;
        window.addEventListener('mousedown', () => {
            document.querySelector('.relative.flex.flex-col').style.transform = 'translateY(-40px) scale(1.1)';
            document.querySelector('.relative.flex.flex-col').style.transition = 'transform 0.2s ease-out';
        });
        window.addEventListener('mouseup', () => {
            document.querySelector('.relative.flex.flex-col').style.transform = 'translateY(-32px) scale(1)';
            document.querySelector('.relative.flex.flex-col').style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
        });
    </script>
