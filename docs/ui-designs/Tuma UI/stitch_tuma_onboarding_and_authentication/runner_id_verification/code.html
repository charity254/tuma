<label class="font-label-sm text-label-sm text-on-surface-variant mb-base" for="id_number">National ID Number</label>
<input class="bg-transparent border-0 border-b border-surface-variant focus:border-primary-container focus:ring-0 px-0 py-sm font-body-md text-body-md text-on-surface transition-colors duration-200 outline-none rounded-2xl" id="id_number" name="id_number" placeholder="Enter your ID number" type="text">
</div>
<!-- Document Uploads Grid -->
<div class="grid grid-cols-2 gap-md">
<!-- Front of ID -->
<button class="group flex flex-col items-center justify-center border border-dashed border-surface-variant p-md aspect-square hover:bg-surface-container-low transition-colors duration-200 rounded-2xl" type="button">
<span class="material-symbols-outlined text-primary-container text-4xl mb-sm group-hover:scale-110 transition-transform duration-200">photo_camera</span>
<span class="font-label-sm text-label-sm text-on-surface text-center">Front of ID</span>

<button class="group flex flex-col items-center justify-center border border-dashed border-surface-variant p-md aspect-square hover:bg-surface-container-low transition-colors duration-200 rounded-2xl" type="button">

</button>
