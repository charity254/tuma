<!-- Bottom Navigation Bar (Shared Component) - Suppressed as per Task Intent (Transactional) -->
<!-- However, task mentions Tuma brand consistency, we ensure the UI matches the guidelines -->
<script>
        // Simple Countdown Logic
        let timeLeft = 29 * 60 + 59;
        const timerDisplay = document.getElementById('timer');
        
        const countdown = setInterval(() => {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerDisplay.textContent = "00:00";
            } else {
                timeLeft--;
            }
        }, 1000);

        // Interaction for buttons
        document.querySelector('.bg-primary-container').addEventListener('click', () => {
            alert('Delivery confirmed! Thank you for using Tuma.');
        });

        document.querySelector('.text-error').addEventListener('click', () => {
            const confirmDispute = confirm('Are you sure you want to raise a dispute for this errand? Our support team will review the delivery.');
            if(confirmDispute) {
                console.log('Dispute raised');
            }
        });
    </script>
