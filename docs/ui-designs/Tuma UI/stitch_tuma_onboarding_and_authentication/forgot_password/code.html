<!-- Main Content -->
<main class="flex-grow pt-24 px-container-margin pb-lg flex flex-col items-center justify-center relative">
<div class="w-full max-w-md w-full relative z-10 space-y-xl">
<!-- Header Section -->
<div class="text-center space-y-sm">
<h1 class="font-headline-lg text-headline-lg md:hidden">Reset your password</h1>
<h1 class="font-headline-lg text-headline-lg hidden md:block">Reset your password</h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Enter your email address and we'll send you a link to reset your password.
                </p>
</div>
<!-- Form Section -->
<form class="space-y-lg w-full" id="resetForm" onsubmit="event.preventDefault(); showSuccessState();">
<div class="relative w-full group">
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-1" for="email">Email Address</label>
<input class="w-full bg-transparent border-0 border-b border-surface-dim focus:ring-0 focus:border-b-2 focus:border-primary-container font-body-lg text-body-lg text-on-surface placeholder-secondary-fixed-dim px-0 py-2 transition-colors duration-200 rounded-2xl" id="email" name="email" placeholder="your@email.com" required="" type="email">
</div>
<button class="w-full bg-primary-container text-on-primary-container font-label-md text-label-md py-4 px-6 hover:opacity-90 transition-opacity duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container flex items-center justify-center rounded-2xl" type="submit">Send reset link</button>
</form>
<!-- Success Alert State (Hidden by default) -->
<div class="hidden transform transition-all duration-500 opacity-0 translate-y-4" id="successAlert">
<div class="bg-[#FDF3DC] border border-[#E8A820] rounded-2xl p-md flex items-start space-x-md"><div class="flex-shrink-0 pt-1"><span class="material-symbols-outlined text-primary-container" data-icon="check_circle" data-weight="fill" style="font-variation-settings: &quot;FILL&quot; 1;">check_circle</span></div><div><h3 class="font-headline-sm text-headline-sm text-on-surface mb-1">Check your inbox</h3><p class="font-body-md text-body-md text-on-surface-variant">We sent a reset link to your email. Please click the link to create a new password.</p></div></div>
<div class="mt-lg text-center">
<button class="font-label-md text-label-md text-primary hover:underline focus:outline-none" onclick="window.location.reload()">
                        Didn't receive it? Try again
                    </button>
</div>
</div>
</div>
</main>
<script>
        function showSuccessState() {
            const form = document.getElementById('resetForm');
            const alert = document.getElementById('successAlert');
            
            // Fade out form
            form.style.opacity = '0';
            setTimeout(() => {
                form.classList.add('hidden');
                
                // Show and animate in alert
                alert.classList.remove('hidden');
                // Small delay to ensure display:block applies before animating opacity
                setTimeout(() => {
                    alert.classList.remove('opacity-0', 'translate-y-4');
                }, 50);
            }, 300);
        }
    </script>
