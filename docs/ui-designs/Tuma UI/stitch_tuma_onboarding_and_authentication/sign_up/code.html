<script>
        // Subtle interaction: adding "filled" class to inputs that have content
        const inputs = document.querySelectorAll('.tuma-input');
        inputs.forEach(input => {
            input.addEventListener('blur', (e) => {
                if (e.target.value.trim() !== "") {
                    e.target.classList.add('border-on-background');
                    e.target.classList.remove('border-secondary-fixed-dim');
                } else {
                    e.target.classList.remove('border-on-background');
                    e.target.classList.add('border-secondary-fixed-dim');
                }
            });
        });

        // Simple mock for the focus state on the email field specifically for the brief
        const emailField = document.getElementById('email');
        if(emailField) {
            emailField.addEventListener('focus', () => {
                emailField.previousElementSibling.classList.add('text-primary');
                emailField.previousElementSibling.classList.remove('text-secondary');
            });
            emailField.addEventListener('blur', () => {
                // Keep mustard if it's the "focused" example, otherwise reset
                if (emailField.id !== 'email') {
                    emailField.previousElementSibling.classList.remove('text-primary');
                    emailField.previousElementSibling.classList.add('text-secondary');
                }
            });
        }
    </script>
