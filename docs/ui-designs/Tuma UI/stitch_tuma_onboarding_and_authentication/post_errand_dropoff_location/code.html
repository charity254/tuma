<!-- Contextual Status Interaction Script -->
<script>
        // Simple micro-interaction for the search bar focus
        const searchInput = document.querySelector('input[type="text"]');
        const searchContainer = searchInput.parentElement;

        searchInput.addEventListener('focus', () => {
            searchContainer.classList.add('border-primary-container', 'ring-1', 'ring-primary-container');
            searchContainer.classList.remove('border-outline');
        });

        searchInput.addEventListener('blur', () => {
            searchContainer.classList.remove('border-primary-container', 'ring-1', 'ring-primary-container');
            searchContainer.classList.add('border-outline');
        });

        // Toggle dropoff selection logic simulation
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                this.classList.add('scale-95');
                setTimeout(() => this.classList.remove('scale-95'), 100);
            });
        });
    </script>
