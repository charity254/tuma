<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto pt-24 pb-32 px-container-margin flex flex-col max-w-md mx-auto w-full">
<!-- Header Section -->

<p class="font-body-md text-body-md text-secondary">Select your primary role to customize your experience.</p>
</div>
<!-- Role Selection Cards -->
<div class="flex flex-col gap-md">
<!-- Customer Card (Selected State) -->
<button class="relative w-full text-left bg-[#FDF3DC] border-2 border-primary-container p-lg transition-all active:scale-[0.98] flex items-center gap-md group rounded-2xl" id="role-customer">
<div class="w-12 h-12 rounded-full bg-primary-container/20 flex items-center justify-center shrink-0">

</div>
<div class="flex-1">

<p class="font-body-md text-body-md text-on-surface-variant opacity-80">I need errands run or tasks completed.</p>
</div>
<!-- Selected Badge -->

            Continue

<script>
        // Simple Interaction Logic for Role Selection
        document.addEventListener('DOMContentLoaded', () => {
            const customerBtn = document.getElementById('role-customer');
            const runnerBtn = document.getElementById('role-runner');
            const customerBadge = document.getElementById('badge-customer');
            const runnerBadge = document.getElementById('badge-runner');

            const selectRole = (selectedBtn, unselectedBtn, selectedBadge, unselectedBadge) => {
                // Apply selected styles
                selectedBtn.classList.remove('bg-surface-container-lowest', 'border-surface-variant', 'border', 'hover:border-outline-variant');
                selectedBtn.classList.add('bg-[#FDF3DC]', 'border-2', 'border-primary-container');
                
                // Update icon styles for selected
                const selIconContainer = selectedBtn.querySelector('.w-12');
                selIconContainer.classList.remove('bg-surface-container-low', 'group-hover:bg-surface-variant');
                selIconContainer.classList.add('bg-primary-container/20');
                
                const selIcon = selectedBtn.querySelector('.material-symbols-outlined:not([id^="badge"])');
                selIcon.classList.remove('text-secondary');
                selIcon.classList.add('fill', 'text-on-surface');

                const selText = selectedBtn.querySelectorAll('p');
                selText[0].classList.remove('text-secondary');
                selText[0].classList.add('text-on-surface-variant', 'opacity-80');

                // Apply unselected styles
                unselectedBtn.classList.add('bg-surface-container-lowest', 'border-surface-variant', 'border', 'hover:border-outline-variant');
                unselectedBtn.classList.remove('bg-[#FDF3DC]', 'border-2', 'border-primary-container');

                // Update icon styles for unselected
                const unselIconContainer = unselectedBtn.querySelector('.w-12');
                unselIconContainer.classList.add('bg-surface-container-low', 'group-hover:bg-surface-variant');
                unselIconContainer.classList.remove('bg-primary-container/20');

                const unselIcon = unselectedBtn.querySelector('.material-symbols-outlined:not([id^="badge"])');
                unselIcon.classList.add('text-secondary');
                unselIcon.classList.remove('fill', 'text-on-surface');

                const unselText = unselectedBtn.querySelectorAll('p');
                unselText[0].classList.add('text-secondary');
                unselText[0].classList.remove('text-on-surface-variant', 'opacity-80');

                // Manage badges
                selectedBadge.classList.remove('hidden');
                selectedBadge.classList.add('badge-enter');
                
                unselectedBadge.classList.add('hidden');
                unselectedBadge.classList.remove('badge-enter');
            };

            customerBtn.addEventListener('click', () => selectRole(customerBtn, runnerBtn, customerBadge, runnerBadge));
            runnerBtn.addEventListener('click', () => selectRole(runnerBtn, customerBtn, runnerBadge, customerBadge));
        });
    </script>
